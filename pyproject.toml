[project]
name = "lerobot-inference"
version = "1.0.5"
description = "Standalone inference and policy_train conversion for lerobot_trainer artifacts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    # PyPI 默认的 torch>=2.10 是 CUDA 13 构建，Ubuntu 20.04 + NVIDIA 驱动 550
    # （CUDA 12.4）跑不起来；固定到 2.9.1（PyPI 上的 cu128 构建，含 sm_80/86/90/120）。
    "torch==2.9.1",
    "torchvision==0.24.1",

    # lerobot 0.7 自带 G0.5（policies/g05）；transformers 范围跟随 lerobot[g05]。
    # g05 预处理的 render_runtime_messages 经 lerobot.datasets 导入 recipe，而该包
    # __init__ 强制要求 datasets/av，lerobot[g05] 没声明，这里补上 dataset extra。
    "lerobot[dataset,g05,pi,smolvla,vla-jepa]==0.7.0",
    "transformers>=5.22.0,<5.23.0",

    "numpy==2.2.6",
    "einops>=0.7.0",
    "safetensors>=0.4.0",
    "PyYAML>=6.0",
    "pillow>=10.0.0",
    "opencv-python-headless==4.13.0.92",
    "huggingface-hub>=0.20.0",
    "packaging>=24.0",
    "tqdm>=4.65.0",

    "forge-msgs==1.2.0",
    "forge-common==1.0.1",
    "forge-policy==1.0.1",
    "forge-tool[dora]==1.0.0",
    "dora-rs==0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
# 统一入口：lerobot <convert|infer|infer-once> ...
lerobot = "lerobot_inference.cli:main"
# 兼容旧命令名（自动注入对应子命令）
lerobot-infer-once = "lerobot_inference.cli:main_infer_once"
lerobot-infer = "lerobot_inference.cli:main_infer"
lerobot-convert = "lerobot_inference.cli:main_convert"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-packages = false

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "lerobot_inference/__init__.py"
"__main__.py" = "lerobot_inference/__main__.py"
"cli.py" = "lerobot_inference/cli.py"
"inference" = "lerobot_inference/inference"
"convert" = "lerobot_inference/convert"
"common" = "lerobot_inference/common"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# TRY004: config validation deliberately raises ValueError for end users.
# BLE001: deliberate blind-exception boundaries carry inline noqa comments
# with justification at each site.
ignore = ["TRY004"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
