name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Unit tests
        run: uv run pytest -q
      - name: Verify CLI
        run: |
          uv run lerobot --help
          test "$(uv run lerobot --version)" = "lerobot 1.0.5"
      - name: Import Forge packages
        run: uv run python -c "import forge_common, forge_msgs, forge_policy, forge_tool"
      - name: License and public-tree checks
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f THIRD_PARTY_NOTICES.md
          test -f OPEN_SOURCE_AUDIT.md
          ! git grep -n -E 'gitlab\.ex-ai\.cn|meta-emt|/home/|/Users/' -- ':!.github/workflows/ci.yml'

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Export and audit locked runtime dependencies
        run: |
          uv export --frozen --format requirements-txt --no-dev --no-extra dev --no-extra build --no-emit-project --output-file /tmp/requirements.txt
          # Ignored IDs are accepted known limitations listed in
          # .github/pip-audit-ignore.txt and documented in OPEN_SOURCE_AUDIT.md;
          # any NEW vulnerability still fails CI.
          ignore_args=$(sed -e 's/#.*//' .github/pip-audit-ignore.txt | awk 'NF {print "--ignore-vuln", $1}')
          # shellcheck disable=SC2086
          uvx --python 3.12 pip-audit $ignore_args \
            --requirement /tmp/requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan publishable text for secrets
        run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '^\.git/' > /tmp/secrets.json
          python - <<'PY'
          import json
          with open("/tmp/secrets.json", encoding="utf-8") as stream:
              findings = json.load(stream).get("results", {})
          if findings:
              raise SystemExit(f"Potential secrets detected: {findings}")
          PY
